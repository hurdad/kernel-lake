# Local, single-machine KernelLake observability + benchmark stack:
# kernellake-server + OTel Collector + Prometheus + Grafana + MinIO
# (S3-compatible object storage, standing in for real S3 -- see
# scripts/generate_and_upload_data.sh). Distinct from
# benchmarks/aws/monitoring/ (that one is two *reference* copies of what
# each of two separate real EC2 instance types actually runs, rendered by
# Terraform -- this is one self-contained stack meant to be brought up
# directly with `docker compose up`, no cloud account needed).
#
# Usage (from this directory):
#   docker compose up -d --build
#   ./scripts/generate_and_upload_data.sh          # once, or after `docker compose down -v`
#   ./scripts/run_e2e.py                            # smoke test + TPC-H benchmark + metrics check
#   docker compose down [-v]                        # -v also drops the MinIO/Grafana/Prometheus volumes
#
# GPU is required by default (kernellake-server builds the `runtime-gpu`
# Dockerfile target and requests `--gpus all`). For a GPU-less machine, set
# KERNELLAKE_TARGET=runtime-cpu and drop/comment the `deploy.resources`
# block below, and pass --backend cpu explicitly in scripts/run_e2e.py's
# own query calls (kernellake-server itself will otherwise still try to
# construct a GpuExecutionCoordinator -- see config/kernellake-server.yaml's
# own comment on engine.backend).
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the bucket kernellake-server/scripts read/write, plus
  # a second bucket + real (committed, not generated) Parquet fixture for
  # the Unity Catalog integration's own MinIO-backed tests
  # (tests/unit/query_engine_unitycatalog_test.cpp's Minio*-prefixed
  # tests, which supply the table's own table_id/schema directly as canned
  # LoopbackHttpServer responses, not via a real Unity Catalog server --
  # see this file's own `unitycatalog` service below for why there's no
  # `unitycatalog-init` service registering this table for real: Unity
  # Catalog's own external-table write path needs real AWS IAM/STS
  # internally too, which MinIO can't satisfy). Then exits. `docker
  # compose up` runs it to completion before anything
  # depends_on: condition: service_completed_successfully waits on it.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./fixtures/unity_catalog_test_data:/fixtures/unity_catalog_test_data:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/kernellake-bench &&
      mc mb --ignore-existing local/kernellake-uc-test &&
      mc cp /fixtures/unity_catalog_test_data/orders/data-0.parquet local/kernellake-uc-test/orders/data-0.parquet
      "

  # Real unitycatalog/unitycatalog OSS server (not a stub/mock) for live,
  # manual verification of the read_unity_catalog(...) SQL surface
  # (src/unitycatalog/) against an actual Unity Catalog REST API -- see
  # docs/ROADMAP.md's Unity Catalog entry for what this confirmed for
  # real (exact response field names, a real dangling-string_view bug,
  # storage_location's real "file://" URI form). Ships its own demo
  # catalog/schema ("unity"/"default") with a few sample Delta/Parquet
  # tables out of the box (`curl http://localhost:8080/api/2.1/unity-catalog/tables?catalog_name=unity&schema_name=default`
  # lists them) -- enough to manually exercise get_table()/dispatch
  # against real server responses via
  # `kernellake explain --sql "SELECT * FROM read_unity_catalog('<instance>.unity.default.numbers')"`.
  #
  # No init step here registering a new table against this stack's own
  # MinIO: tried it (`bin/uc table create ... --storage_location
  # s3://...`), and confirmed it doesn't work in this environment -- Unity
  # Catalog's own external-table creation validates/bootstraps the
  # storage location using its *own* internal temporary-credentials
  # vending, which (like the read-side vending kernellake's own client
  # calls) is AWS-IAM-role/STS-based; MinIO can't honor that without much
  # deeper setup than this local stack aims for. The Minio*-prefixed tests
  # in tests/unit/query_engine_unitycatalog_test.cpp cover the S3-vended-
  # credentials code path a different way instead: a controlled fixture
  # response (not this real server) supplies the "vended" credentials
  # (MinIO's own static ones), so kernellake's *own* S3 access is verified
  # for real without depending on Unity Catalog's server-side S3
  # bootstrapping working here.
  unitycatalog:
    image: unitycatalog/unitycatalog:latest
    ports:
      - "8080:8080"   # Unity Catalog REST API
    healthcheck:
      # No curl in this image (Alpine, JVM-only) -- bash's /dev/tcp is a
      # builtin, same technique kernellake-server's own healthcheck below
      # already uses for the identical reason.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # All-in-one Jaeger (in-memory span storage -- SPAN_STORAGE_TYPE
  # defaults to "memory", fine for a local dev/benchmark stack; traces are
  # lost on `docker compose down`). Accepts OTLP natively (Jaeger >= 1.35)
  # on 4317/4318 -- otel-collector-config.yaml's traces pipeline exports
  # straight to it, no Jaeger-native-protocol conversion needed. Only
  # 16686 (the query UI/API) is published to the host; its own 4317/4318
  # stay container-internal (otel-collector's identically-numbered ports
  # are already published for that purpose -- see below).
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI / query API

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP
      - "8889:8889"   # Prometheus exporter (scraped by the prometheus service below)
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      # Anonymous viewer access -- this is a local dev/benchmark stack, not
      # a shared/internet-facing deployment; see
      # benchmarks/aws/monitoring/docker-compose.yml's own identical
      # comment for the same reasoning in that context.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    depends_on:
      - prometheus

  kernellake-server:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: ${KERNELLAKE_TARGET:-runtime-gpu}
    entrypoint: ["/opt/kernellake/bin/kernellake-server"]
    command: ["--config", "/config/kernellake-server.yaml"]
    volumes:
      - ./config/kernellake-server.yaml:/config/kernellake-server.yaml:ro
      # Backs storage.cache.directory (config/kernellake-server.yaml) -- a
      # named volume, not container-ephemeral storage, so the NVMe cache
      # actually survives `docker compose restart`/container recreation as
      # designed (see docs/ARCHITECTURE.md's "NVMe cache tier" section).
      # `docker compose down -v` still drops it, same as the other stateful
      # volumes below.
      - nvme-cache-data:/cache
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    ports:
      - "31337:31337"
    depends_on:
      minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # No HTTP endpoint (Flight SQL is gRPC-over-plain-TCP) and the
      # runtime image is deliberately minimal (no curl/nc -- see
      # docker/Dockerfile's own comment) -- bash's /dev/tcp is a builtin,
      # needs no extra binary, and is good enough to confirm the server is
      # actually accepting connections on its port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/31337"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  minio-data:
  prometheus-data:
  grafana-data:
  nvme-cache-data:

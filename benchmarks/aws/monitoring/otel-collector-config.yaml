# Reference copy of the OTel Collector config each KernelLake host actually
# runs -- the live copy is embedded directly in
# ../terraform/user-data/kernellake-host-init.sh (a boot-time dependency,
# so it can't wait on an S3 fetch the way monitoring/grafana/dashboards/
# does), kept in sync with this file by hand. Same "vendored, not
# build-time linked" convention this repo's own proto/delta_txn.proto
# already uses for a cross-repo copy.
#
# Receives kernellake-server's real OTel metrics on :4317 (OTLP gRPC,
# matching ObservabilitySection::otlp_endpoint's default) and exposes them
# for the central Prometheus instance to scrape on :8889/metrics.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  # No trace/log backend wired up this phase (the ask was metrics ->
  # Prometheus specifically) -- `debug` just logs to the collector's own
  # stdout, which is required (not optional): a pipeline with zero
  # exporters is rejected outright by the collector at startup ("must have
  # at least one exporter" -- confirmed for real against a live AWS run,
  # where an empty exporters: [] here crash-looped the container). Add a
  # real backend (Jaeger/Tempo/etc.) and swap this exporter out if trace/
  # log visualization is wanted later.
  debug: {}

processors:
  batch: {}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

# Optional local pre-commit hook (spec: "optional pre-commit configuration").
# Install with: pip install pre-commit && pre-commit install
#
# clang-tidy needs a real compile_commands.json (`cmake --preset cpu-dev` at
# minimum -- CMAKE_EXPORT_COMPILE_COMMANDS is ON for every preset, see root
# CMakeLists.txt) to already exist at build/cpu-dev before this hook can run;
# it is scoped to build/cpu-dev's own file set (the `cpu-dev` preset -- everything
# except src/server/, src/execution_gpu/, src/memory/rmm_environment.cpp,
# src/api/query_engine_execute_gpu.cpp, and
# src/observability/query_tracing_otel.cpp/query_tracing_test_support.cpp),
# since those need the server-dev/otel-dev/gpu-dev presets built instead --
# CI's clang-tidy/server-build-test/otel-build-test jobs cover those against
# their own preset builds (see .github/workflows/ci.yml); a single local git
# hook can't reasonably require every contributor to configure and build
# three extra presets just to commit.
repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format --style=file -i
        language: system
        files: \.(cpp|hpp)$
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy-18 -p build/cpu-dev -quiet --warnings-as-errors=*
        language: system
        files: ^src/.*\.cpp$
        exclude: >-
          (?x)^src/(
            server/.* |
            execution_gpu/.* |
            memory/rmm_environment\.cpp |
            api/query_engine_execute_gpu\.cpp |
            observability/query_tracing_otel\.cpp |
            observability/query_tracing_test_support\.cpp
          )$

{{/*
Renders a real kernellake-server.yaml (see
include/kernellake/common/config.hpp / config/kernellake-server.yaml for
the full ServerConfig shape) from this chart's thin values surface -- this
chart only ever deploys kernellake-server, never the CLI. Any
section/field not set here falls back to kernellake's own compiled-in
default -- parse_server_config() only overrides keys actually present in
the YAML (src/common/config.cpp's read_or() helper), so a minimal file
here is intentional, not an oversight.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kernellake.fullname" . }}
  labels:
    {{- include "kernellake.labels" . | nindent 4 }}
{{/*
Every numeric value below is piped through `| int64`: Helm/sprig's generic
YAML->JSON->interface{} value decoding turns whole numbers into float64,
and Go's default float64 formatting switches to scientific notation past a
few digits (confirmed by an actual `helm template` run rendering
"1e+06"/"8.589934592e+09" before these casts were added) -- yaml-cpp on
the receiving end would either reject or misparse that.
*/}}
data:
  kernellake-server.yaml: |
    engine:
      backend: {{ .Values.backend }}
      batch_rows: {{ .Values.config.engine.batchRows | int64 }}
      result_batch_rows: {{ .Values.config.engine.resultBatchRows | int64 }}
      query_memory_limit_bytes: {{ .Values.config.engine.queryMemoryLimitBytes | int64 }}

    storage:
      local_root: {{ .Values.config.storage.localRoot | quote }}

    server:
      host: 0.0.0.0
      port: {{ .Values.service.port | int64 }}
{{- if .Values.server.tls.enabled }}
      use_tls: true
      # Paths match the Secret volume mounts in templates/deployment.yaml --
      # a Secret's keys are each mounted as a file named after the key
      # directly under the mount path.
      tls_cert_path: /etc/kernellake/tls/{{ .Values.server.tls.secretCertKey }}
      tls_key_path: /etc/kernellake/tls/{{ .Values.server.tls.secretKeyKey }}
{{- if .Values.server.tls.requireClientCert }}
      require_client_cert: true
      tls_client_ca_cert_path: /etc/kernellake/tls-client-ca/{{ .Values.server.tls.clientCaSecretKey }}
{{- end }}
{{- end }}

    observability:
      enabled: {{ .Values.observability.enabled }}
      otlp_protocol: {{ .Values.observability.otlpProtocol }}
      otlp_endpoint: {{ .Values.observability.otlpEndpoint | quote }}
      service_name: {{ .Values.observability.serviceName | quote }}
      use_tls: {{ .Values.observability.useTls }}

apiVersion: v1
kind: Service
metadata:
  name: {{ include "kernellake.fullname" . }}
  labels:
    {{- include "kernellake.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: flight-sql
      # See templates/configmap.yaml's comment on why numeric values need
      # an explicit int64 cast here.
      port: {{ .Values.service.port | int64 }}
      targetPort: flight-sql
      protocol: TCP
  selector:
    {{- include "kernellake.selectorLabels" . | nindent 4 }}

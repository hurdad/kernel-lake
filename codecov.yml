# Defines a "gpu" component so Codecov reports a real, isolated coverage
# percentage for GPU-only code instead of blending it against the whole
# repo's line count.
#
# Real bug this fixes: the `gpu` flag (.github/workflows/ci.yml's
# gpu-coverage job uploads gpu-coverage.xml under `flags: gpu`) is scoped
# server-side to a small, deliberate subset of the codebase -- only the
# files that actually require KERNELLAKE_WITH_CUDA=ON to compile/execute
# at all (see that job's own gcovr --filter list, mirrored as `paths`
# below). Without a component explicitly scoping the flag to those same
# paths, Codecov's own /flags/ API computed that flag's coverage against
# the *entire* repo's line count as the denominator (8545 lines, most of
# which the gpu flag never uploads data for at all) instead of just the
# ~1980 lines it actually covers -- reporting 48.47% when a real local
# rebuild of the exact same commit, using the exact same gcovr command
# this job runs, measured 85.3%. Confirmed via Codecov's own component
# docs: "If both flag_regexes and paths are defined for a component, that
# filter is AND-style" -- paths alone isn't enough, since without the
# flag_regexes match a path-only component would also pull in whatever
# the unflagged CPU session reports for any file that happens to overlap
# (none currently do, but nothing enforces that staying true).
component_management:
  individual_components:
    - component_id: gpu
      name: GPU execution
      paths:
        - src/execution_gpu/**
        - src/api/query_engine_execute_gpu.cpp
        - src/memory/gpu_memory_metrics*.cpp
        - src/memory/rmm_environment.cpp
        - src/server/gpu_execution_coordinator_gpu.cpp
      flag_regexes:
        - gpu

# gpu-coverage (.github/workflows/ci.yml) only runs on a direct push to main
# or workflow_dispatch -- its own `if: github.event_name != 'pull_request'`
# guard, required because it's the only job here that runs on the
# self-hosted GPU runner (see that job's own comment on why). That means no
# pull_request commit ever uploads a report carrying the `gpu` flag, only
# the unflagged coverage.xml from the `coverage` job (CPU-only, gcovr's own
# `src/`+`include/` filter there never touches GPU-only files, since
# cpu-coverage's build doesn't compile them at all).
#
# Without carryforward, Codecov's PR-vs-base diff would compare that
# GPU-less PR report against main's own report (which does carry the `gpu`
# flag's ~1980 lines at ~85% coverage, from the most recent push-to-main
# run) -- making every single PR look like it regresses total project
# coverage, purely because the GPU lines are absent from its own report,
# not because anything in the PR actually changed. `carryforward: true`
# tells Codecov to keep reusing the most recent `gpu`-flagged upload for
# any commit that doesn't produce a new one itself, so PR comparisons stay
# apples-to-apples.
flag_management:
  individual_flags:
    - name: gpu
      carryforward: true

engine:
  device_id: 0
  batch_rows: 1000000
  result_batch_rows: 65536
  # 0 means auto-detect from the GPU's currently free VRAM -- see
  # EngineSection::query_memory_limit_bytes's own comment
  # (include/kernellake/common/config.hpp) for why. Set an explicit
  # non-zero byte count here to override auto-detection.
  query_memory_limit_bytes: 0
  # 0 means "use HashAggregateOperator::kDefaultMaxDistinctKeys". A fixed
  # safety cap on GROUP BY result cardinality, not a cardinality estimate
  # -- see EngineSection::max_distinct_keys's own comment for why this is
  # config-driven (real TPC-H scale factor has already needed this raised
  # twice: SF100's ~10.8M measured distinct groups, SF1000's ~38.9M).
  max_distinct_keys: 0

memory:
  pool_initial_bytes: 1073741824
  pool_max_bytes: 8589934592
  use_async_allocator: true

storage:
  local_root: /
  # A backend is never "enabled" by a flag -- it's constructed the first
  # time a query references a matching URI scheme ("s3://", "gs://",
  # "abfs://"). Every field below is optional; empty/unset means "use that
  # provider's own default" (real AWS S3/GCS/Azure, default credential
  # chain). See include/kernellake/common/config.hpp for full field docs --
  # these sections mirror Arrow's own S3Options/GcsOptions/AzureOptions/
  # HdfsOptions field-for-field.
  s3:
    credentials_kind: default  # anonymous | default | explicit | role | web_identity
    region: ""
    endpoint_override: ""      # e.g. "localhost:9000" for MinIO
    scheme: https               # https | http -- MinIO w/o TLS needs http
    tls_verify_certificates: true
    # Threads backing the AWS SDK's process-wide S3 I/O event loop
    # (arrow::fs::S3GlobalOptions::num_event_loop_threads). Arrow's own
    # default (1) is documented as fine for "at most, in the hundreds" of
    # concurrent connections -- a single large Parquet scan pass at real
    # SF1000 scale can burst well past that. Only the *first* S3 config
    # constructed in this process actually takes effect (see
    # S3Section::s3_event_loop_threads's own comment).
    event_loop_threads: 1
  gcs:
    credentials_kind: default  # anonymous | default | access_token | service_account_json
    endpoint_override: ""      # e.g. "localhost:4443" for fake-gcs-server
    scheme: https               # https | http -- the emulator needs http
  azure:
    credentials_kind: default  # default | anonymous | storage_shared_key | sas_token |
                                # client_secret | managed_identity | cli | workload_identity | environment
    account_name: ""
    blob_storage_authority: .blob.core.windows.net  # e.g. "127.0.0.1:10000" for Azurite
    dfs_storage_authority: .dfs.core.windows.net    # e.g. "127.0.0.1:10001" for Azurite
    blob_storage_scheme: https  # https | http -- Azurite needs http
    dfs_storage_scheme: https
  # HDFS: config schema only in this pass (no lightweight local emulator
  # for real verification, see docs/ROADMAP.md).
  hdfs:
    connection_config:
      host: ""
      port: 0
  # Local-NVMe read-through cache in front of the remote (s3/gcs/azure/hdfs)
  # backends above -- see docs/ARCHITECTURE.md's "NVMe cache tier" section.
  # Disabled by default; never applies to plain local paths. On a cache
  # miss, the whole remote object is downloaded once to `directory` and
  # served from there for every later read of that same object (repeat
  # queries against overlapping data become a local disk read instead of a
  # network fetch).
  cache:
    enabled: false
    directory: ""            # e.g. "/mnt/nvme/kernellake-cache" -- required if enabled
    max_size_bytes: 107374182400  # 100 GiB; 0 means unbounded (no eviction)

logging:
  level: info
  json: false

profiling:
  nvtx: true
  operator_metrics: true

benchmark:
  default_iterations: 5
  warmup_iterations: 1
  output_format: json
  verify_results: true
  baseline: duckdb

# Only consumed by kernellake-server (KERNELLAKE_BUILD_SERVER=ON).
server:
  host: 0.0.0.0
  port: 31337
  # Inbound TLS for the Flight SQL listener. Both tls_cert_path and
  # tls_key_path (PEM) are required when use_tls is true.
  use_tls: false
  tls_cert_path: ""
  tls_key_path: ""
  # mTLS: require clients to present a certificate signed by the CA in
  # tls_client_ca_cert_path. Requires use_tls: true.
  require_client_cert: false
  tls_client_ca_cert_path: ""
  # Static bearer-token auth: every RPC must carry an
  # "authorization: Bearer <auth_token>" header, or it's rejected before
  # reaching the query engine. auth_token must be set when auth_enabled is
  # true. Combine with use_tls above -- a bearer token sent over plaintext
  # gives an eavesdropper the token itself.
  auth_enabled: false
  auth_token: ""

# Only takes effect when built with KERNELLAKE_ENABLE_OTEL=ON. See
# include/kernellake/common/config.hpp for full field docs -- notably:
# otlp_endpoint's shape depends on otlp_protocol (host:port for grpc, a full
# URL for http); use_tls/tls_ca_cert_path apply to grpc only (http uses the
# endpoint's own scheme); tls_client_cert_path/tls_client_key_path (mTLS)
# apply to http only.
observability:
  enabled: false
  otlp_protocol: grpc  # grpc | http
  otlp_endpoint: localhost:4317
  service_name: kernellake
  use_tls: false
  tls_ca_cert_path: ""
  tls_client_cert_path: ""
  tls_client_key_path: ""
  tracing:
    processor: batch  # simple | batch
    batch:
      max_queue_size: 2048
      max_export_batch_size: 512
      schedule_delay_ms: 5000
    sampler: default  # default | always | never
  # Metrics always use a periodic reader (no simple/batch choice).
  metrics:
    export_interval_ms: 60000
    export_timeout_ms: 30000
  logs:
    processor: batch  # simple | batch
    batch:
      max_queue_size: 2048
      max_export_batch_size: 512
      schedule_delay_ms: 5000

# Default config for the `kernellake` CLI (query/explain/inspect-parquet/
# benchmark tpch) -- loaded automatically when no --config is passed
# (src/cli/main.cpp), and contains only the top-level keys CliConfig
# actually reads. See include/kernellake/common/config.hpp's own comment
# on the EngineConfig/CliConfig/ServerConfig split for why this and
# kernellake-server.yaml look different: `device_id` and `benchmark:`
# below are CLI-only and would simply be ignored if a kernellake-server
# process read this same file; `server:` and
# `engine.max_concurrent_gpu_queries`/`engine.gpu_device_ids` (server-only)
# are omitted here entirely since the CLI never reads them.

engine:
  # Which GPU an ad-hoc CLI query runs on (`kernellake query --backend gpu`,
  # or the config-file default when --backend isn't passed). Only matters
  # on a multi-GPU box; on a single-GPU dev machine, leave at 0.
  device_id: 0
  batch_rows: 1000000
  result_batch_rows: 65536
  # 0 means auto-detect from the GPU's currently free VRAM -- see
  # EngineSection::query_memory_limit_bytes's own comment
  # (include/kernellake/common/config.hpp) for why. Set an explicit
  # non-zero byte count here to override auto-detection.
  query_memory_limit_bytes: 0
  # 0 means "use HashAggregateOperator::kDefaultMaxDistinctKeys" -- see
  # that field's own comment for why this is config-driven.
  max_distinct_keys: 0

memory:
  pool_initial_bytes: 1073741824
  pool_max_bytes: 8589934592
  use_async_allocator: true

storage:
  local_root: /
  # A backend is never "enabled" by a flag -- it's constructed the first
  # time a query references a matching URI scheme ("s3://", "gs://",
  # "abfs://"). Every field below is optional; empty/unset means "use that
  # provider's own default" (real AWS S3/GCS/Azure, default credential
  # chain). See include/kernellake/common/config.hpp for full field docs.
  s3:
    credentials_kind: default  # anonymous | default | explicit | role | web_identity
    region: ""
    endpoint_override: ""      # e.g. "localhost:9000" for MinIO
    scheme: https               # https | http -- MinIO w/o TLS needs http
    tls_verify_certificates: true
    event_loop_threads: 4
  gcs:
    credentials_kind: default  # anonymous | default | access_token | service_account_json
    endpoint_override: ""      # e.g. "localhost:4443" for fake-gcs-server
    scheme: https               # https | http -- the emulator needs http
  azure:
    credentials_kind: default  # default | anonymous | storage_shared_key | sas_token |
                                # client_secret | managed_identity | cli | workload_identity | environment
    account_name: ""
    blob_storage_authority: .blob.core.windows.net  # e.g. "127.0.0.1:10000" for Azurite
    dfs_storage_authority: .dfs.core.windows.net    # e.g. "127.0.0.1:10001" for Azurite
    blob_storage_scheme: https  # https | http -- Azurite needs http
    dfs_storage_scheme: https
  hdfs:
    connection_config:
      host: ""
      port: 0
  # Local-NVMe read-through cache in front of the remote (s3/gcs/azure/hdfs)
  # backends above -- see docs/ARCHITECTURE.md's "NVMe cache tier" section.
  cache:
    enabled: false
    directory: ""            # e.g. "/mnt/nvme/kernellake-cache" -- required if enabled
    max_size_bytes: 107374182400  # 100 GiB; 0 means unbounded (no eviction)

logging:
  level: info
  json: false

profiling:
  nvtx: true
  operator_metrics: true

# `kernellake benchmark tpch`'s own defaults, overridable per-run with
# --iterations/--warmup-iterations.
benchmark:
  default_iterations: 5
  warmup_iterations: 1

# Same schema as config/kernellake.yaml's own observability: section --
# only takes effect when built with KERNELLAKE_ENABLE_OTEL=ON.
observability:
  enabled: false
  otlp_protocol: grpc  # grpc | http
  otlp_endpoint: localhost:4317
  service_name: kernellake-cli
  use_tls: false
  tls_ca_cert_path: ""
  tls_client_cert_path: ""
  tls_client_key_path: ""
  tracing:
    processor: batch  # simple | batch
    batch:
      max_queue_size: 2048
      max_export_batch_size: 512
      schedule_delay_ms: 5000
    sampler: default  # default | always | never
  metrics:
    export_interval_ms: 60000
    export_timeout_ms: 30000
  logs:
    processor: batch  # simple | batch
    batch:
      max_queue_size: 2048
      max_export_batch_size: 512
      schedule_delay_ms: 5000

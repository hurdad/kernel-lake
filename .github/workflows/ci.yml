# KernelLake CI. One workflow, six jobs, in dependency order:
#
#   format-check ------------------+
#                                   +--> docker-publish (push to main only)
#   cpu-build-test --+--> tpch-tooling-smoke --+
#                     +--> server-build-test --+
#                     +--> otel-build-test -----+
#
# docker-publish only starts once format-check, cpu-build-test, AND
# tpch-tooling-smoke have all succeeded (via `needs:`) -- a broken build or
# a query file that stops parsing is never shipped as an image.
# server-build-test/otel-build-test are independent of docker-publish's
# gating: they exist to catch KERNELLAKE_BUILD_SERVER/KERNELLAKE_ENABLE_OTEL
# regressions specifically (docker/Dockerfile's own `cmake --preset gpu-dev`
# invocation turns both on unconditionally, so a failure there would also
# break docker-publish, but these two jobs run the CPU-only server-dev/
# otel-dev presets instead of gpu-dev, so their pass/fail is deliberately
# independent of what docker-publish actually ships). Cross-workflow
# `needs:` isn't a feature GitHub Actions has, which is why this is one
# file instead of a separate docker-publish.yml gated some other way (e.g.
# `workflow_run`, which has its own checkout/SHA gotchas).
#
# Every job's underlying shell commands (apt installs, CMake presets,
# ctest, docker buildx) mirror commands actually run and verified in this
# repository's own development environment. All four build-and-test jobs
# (cpu-build-test, tpch-tooling-smoke, server-build-test, otel-build-test)
# run inside a plain `ubuntu:26.04` container (the `container:` key, on the
# same `ubuntu-24.04` GitHub-hosted runner -- there is no `ubuntu-26.04`
# runner label yet) rather than on the runner's own Ubuntu 24.04 directly:
# libarrow-flight-sql-dev and opentelemetry-cpp-dev have always needed
# 26.04 (see docs/ARCHITECTURE.md's "Ubuntu 26.04 baseline" section for
# why -- Ubuntu 24.04's system Abseil is too old, so Arrow bundles its own
# incomplete private copy there instead), and cloud object storage support
# (see "Cloud object storage" in the same doc) means every build now
# unconditionally links Arrow's bundled google-cloud-cpp/Azure SDK C++
# code too, not just the server/otel-enabled presets -- so this same
# constraint now applies to cpu-build-test/tpch-tooling-smoke as well,
# not just server-build-test/otel-build-test. The GitHub Actions runs
# themselves have not been executed (no way to trigger an actual Actions
# run from within this repository's development environment); review the
# first run before trusting it blindly.
#
# GPU-dependent work (the `gpu-dev` preset, `tests/gpu/`, real query
# execution, DuckDB cross-validation, and TPC-H benchmarks) is
# intentionally NOT run here: standard GitHub-hosted runners have no GPU,
# and per the spec's own rule, KernelLake never reports a skipped-GPU test
# as passing. That work needs a self-hosted GPU runner, which is not
# configured in this repository -- see docs/ROADMAP.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          shopt -s globstar
          files=$(find src include tests -name '*.cpp' -o -name '*.hpp')
          clang-format-18 --style=file --dry-run --Werror $files

  cpu-build-test:
    # See this file's own top-of-file comment: plain ubuntu:26.04 (via
    # `container:`, same runner as every other job), not the runner's own
    # Ubuntu 24.04 directly -- config.hpp unconditionally pulls in Arrow's
    # bundled google-cloud-cpp/Azure SDK C++ code now (see
    # docs/ARCHITECTURE.md's "Cloud object storage" section), which needs
    # the same newer system Abseil 26.04 has and 24.04 doesn't.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev
      - name: Install Apache Arrow / Parquet C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends libarrow-dev libparquet-dev libarrow-dataset-dev
      - name: Configure (dev preset, CPU-only)
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure

  tpch-tooling-smoke:
    # See cpu-build-test's own comment on why this needs ubuntu:26.04 too.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: cpu-build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev
      - name: Install Apache Arrow / Parquet C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends libarrow-dev libparquet-dev libarrow-dataset-dev
      - name: Install pyarrow (for generate_tpch.py)
        run: pip install --user --break-system-packages pyarrow
      - name: Build (dev preset)
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: generate-data smoke test
        run: |
          ./build/dev/src/cli/kernellake generate-data --output /tmp/kernellake-sales --rows 10000 --files 2

      # SF1 is the spec's own CI recommendation, but that is a ~6,000,000-row
      # generation run (see tools/generate_tpch.py); a much smaller scale
      # factor is used here to keep CI fast and storage-light, per the same
      # spec section's own allowance ("SF1000 where sufficient storage is
      # available" implies scale is adjusted to the environment). Run the
      # real SF1 generation manually or on a runner sized for it.
      - name: TPC-H data-generation smoke test (small scale factor)
        run: |
          python3 tools/generate_tpch.py --scale-factor 0.001 --output /tmp/kernellake-tpch-smoke \
            --row-group-rows 2000 --files 1

      # No GPU here, so `kernellake query` can't run -- `explain` still
      # exercises SQL parsing, binding, logical planning, optimization, and
      # physical planning (including pruning) against the real generated
      # Parquet files, which is enough to catch a query file that no longer
      # parses/binds against the schema generate_tpch.py produces.
      - name: TPC-H query-file validation (parse/bind/plan only, no GPU)
        run: |
          for q in benchmarks/tpch/queries/*.sql; do
            sql=$(grep -v '^--' "$q" | tr '\n' ' ' | sed "s|{data}|/tmp/kernellake-tpch-smoke/*.parquet|")
            echo "=== $q ==="
            ./build/dev/src/cli/kernellake explain --sql "$sql"
          done

  server-build-test:
    # kernellake-server (KERNELLAKE_BUILD_SERVER=ON) needs
    # libarrow-flight-sql-dev, which does not link against Ubuntu 24.04's
    # system Abseil -- see docs/ARCHITECTURE.md's "Ubuntu 26.04 baseline"
    # section. Standard GitHub-hosted runners don't offer an ubuntu-26.04
    # label yet, so this job stays on the same ubuntu-24.04 runner as every
    # other job but runs its steps inside a plain `ubuntu:26.04` container
    # instead (the `container:` key), the same base image
    # `docker/Dockerfile` itself builds on.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: cpu-build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev
      - name: Install Apache Arrow / Parquet / Flight SQL C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends \
            libarrow-dev libparquet-dev libarrow-dataset-dev \
            libarrow-flight-dev libarrow-flight-sql-dev
      - name: Install gRPC
        run: apt-get install -y --no-install-recommends libgrpc++-dev protobuf-compiler-grpc
      - name: Configure (server-dev preset)
        run: cmake --preset server-dev
      - name: Build
        run: cmake --build --preset server-dev
      - name: Test
        run: ctest --preset server-dev --output-on-failure

  otel-build-test:
    # kernellake's OpenTelemetry integration (KERNELLAKE_ENABLE_OTEL=ON)
    # needs opentelemetry-cpp-dev, which -- like libarrow-flight-sql-dev --
    # has no Ubuntu 24.04 apt package at all (FetchContent vendoring would
    # be the only option there; see docs/ARCHITECTURE.md's "Ubuntu 26.04
    # baseline" section). Same container: ubuntu:26.04 approach as
    # server-build-test, for the same reason (no ubuntu-26.04 GitHub-hosted
    # runner label yet).
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: cpu-build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev
      - name: Install Apache Arrow / Parquet C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends libarrow-dev libparquet-dev libarrow-dataset-dev
      - name: Install opentelemetry-cpp
        run: apt-get install -y --no-install-recommends opentelemetry-cpp-dev
      - name: Configure (otel-dev preset)
        run: cmake --preset otel-dev
      - name: Build
        run: cmake --build --preset otel-dev
      - name: Test
        run: ctest --preset otel-dev --output-on-failure

  docker-publish:
    runs-on: ubuntu-24.04
    needs: [format-check, cpu-build-test, tpch-tooling-smoke]
    # Only publish on an actual push to main -- never on pull_request (a
    # fork's PR run has no packages:write on GITHUB_TOKEN anyway, and an
    # untrusted PR build shouldn't produce a published image) or when one
    # of the jobs above didn't run (e.g. workflow_dispatch is fine since
    # needs: still applies; this `if:` only excludes pull_request).
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          # CUDA devel images plus vendored RAPIDS wheels are large;
          # reclaim space from pre-installed toolchains this build never
          # touches (a common workaround for GitHub-hosted runners' fixed
          # disk size).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          push: true
          tags: ${{ steps.image.outputs.name }}:dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:runtime
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime

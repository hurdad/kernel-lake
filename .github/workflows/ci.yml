# KernelLake CI. One workflow, eleven jobs, in dependency order:
#
#   build-base-image (warms the shared GHA cache; see its own comment)
#         |
#         +--> clang-tidy
#         +--> cpu-build-test --+--> tpch-tooling-smoke --+
#         |                     +--> server-build-test    +--> docker-publish
#         |                     +--> otel-build-test      |    (push to main
#         +--> coverage                                   |     only)
#                                                           |
#   gpu-build-test (self-hosted-GPU-runner-only) -----------+
#   gpu-coverage   (self-hosted-GPU-runner-only, standalone -- see below)
#
# docker-publish only starts once format-check, cpu-build-test,
# tpch-tooling-smoke, AND gpu-build-test have all succeeded (via `needs:`)
# -- a broken build, a query file that stops parsing, or a broken GPU test
# is never shipped as an image (runtime-cpu and runtime-gpu both, since
# they're built in the same job). clang-tidy is a lint job that reads
# `needs: build-base-image` only for a warm Docker layer cache, not
# because it depends on cpu-build-test's own result, and isn't in
# docker-publish's `needs:` list either -- a clang-tidy regression should
# be visibly red on the PR/commit, same as any other job, but a lint-only
# finding blocking the docker image specifically wasn't judged worth
# coupling here (unlike format-check, which already gated docker-publish
# before this job existed, so it stayed as-is rather than being
# second-guessed). coverage/gpu-coverage are the same shape of decision:
# real, useful signals on every push, but not something a coverage dip
# should ever block a release over on its own, so neither is a `needs:` of
# docker-publish nor gated by it -- gpu-build-test exists specifically so
# docker-publish has a *pass/fail* GPU gate that's separate from
# gpu-coverage's own (slower, coverage-instrumented, narrower-scoped --
# see gpu-build-test's own comment) build. server-build-test/otel-build-test
# are independent of docker-publish's gating: they exist to catch
# KERNELLAKE_BUILD_SERVER/KERNELLAKE_ENABLE_OTEL regressions specifically
# (docker/Dockerfile's own `cmake --preset gpu-dev` invocation turns both on
# unconditionally, so a failure there would also break docker-publish, but
# these two jobs run the CPU-only server-dev/otel-dev presets instead of
# gpu-dev, so their pass/fail is deliberately independent of what
# docker-publish actually ships). Cross-workflow `needs:` isn't a feature
# GitHub Actions has, which is why this is one file instead of a separate
# docker-publish.yml gated some other way (e.g. `workflow_run`, which has
# its own checkout/SHA gotchas).
#
# Every job's underlying commands (CMake presets, ctest, docker buildx)
# mirror commands actually run and verified in this repository's own
# development environment. build-base-image, clang-tidy, cpu-build-test,
# coverage, tpch-tooling-smoke, server-build-test, and otel-build-test all
# build (or reuse, via a shared GHA cache scope -- see build-base-image's
# own comment) docker/Dockerfile's `build-base` stage and `docker run`
# their own preset/test/lint commands against it, rather than each
# apt-installing its own hand-maintained copy of the same toolchain --
# that used to be five separate, driftable package lists with no guarantee
# they'd ever stayed in sync with docker/Dockerfile's own. build-base is
# ubuntu:26.04-based: libarrow-flight-sql-dev and opentelemetry-cpp-dev
# have always needed 26.04 (see docs/ARCHITECTURE.md's "Ubuntu 26.04
# baseline" section for why -- Ubuntu 24.04's system Abseil is too old, so
# Arrow bundles its own incomplete private copy there instead), and cloud
# object storage support (see "Cloud object storage" in the same doc)
# means every build now unconditionally links Arrow's bundled
# google-cloud-cpp/Azure SDK C++ code too, not just the server/otel-enabled
# presets. gpu-coverage uses the identical pattern against
# docker/Dockerfile's `gpu-build-base` stage instead (see its own comment
# for why it doesn't share build-base's GHA cache scope). format-check is
# the one job with no Docker/build-base involvement at all -- it only
# needs clang-format-18 on the bare runner, nothing this project builds.
#
# Every libarrow*-dev package build-base installs is pinned to =25.0.1-1
# (the exact apt package version string, Debian revision included) --
# matching how every other real third-party dependency in this project is
# pinned (see docker/Dockerfile's own comment on this). Every other apt
# package there (gRPC, opentelemetry-cpp-dev, gtest, benchmark, spdlog,
# nlohmann-json, yaml-cpp, avro-c, libcurl, libxml2, ...) is left unpinned
# for now. If the 25.0.1-1 build ever disappears from Apache's apt repo,
# bump this pin to whatever revision `apt-cache policy libarrow-dev`
# reports as available then, in docker/Dockerfile (the one place it's
# still hand-written) and README.md -- don't drop back to unpinned.
#
# This workflow runs for real on GitHub Actions on every push to main (not
# a hypothetical -- real run history exists and is inspectable via
# `gh run list`/the Actions tab or the REST API without needing repo
# write access). It has caught real regressions this way more than once:
# a real clang-format drift across several files and a real
# readability-braces-around-statements clang-tidy finding in
# src/observability/query_tracing_otel.cpp both failed CI for real before
# being found and fixed, neither introduced by the fixing commit itself --
# i.e. this workflow had already been silently red on `main` for a
# stretch before that was noticed and corrected. Treat a red run as a real
# signal, not noise to route around.
#
# Most GPU-dependent work (real query execution, DuckDB cross-validation,
# and TPC-H benchmarks) still only ever runs manually, off-CI: standard
# GitHub-hosted runners have no GPU, and per the spec's own rule,
# KernelLake never reports a skipped-GPU test as passing. `gpu-build-test`
# and `gpu-coverage` are the exceptions -- both run on the same
# self-hosted runner with a real GPU attached (label `[self-hosted,
# gpu]`), which is why they're the only two jobs in this file not on
# `ubuntu-24.04`.
#
# That self-hosted runner is a real, persistent machine (not an ephemeral
# GitHub-hosted one), and this repository is public -- a fork's PR could
# otherwise modify this workflow file and have its own arbitrary code
# execute on that machine (which also holds real AWS/SSH credentials for
# this project's benchmark infrastructure). Both jobs' own
# `if: github.event_name != 'pull_request'` guard is the mitigation: each
# job only ever dispatches on a direct push to `main` (which only a
# maintainer can do) or manual `workflow_dispatch`, never on a
# pull_request event (including from this same repo, not just forks) --
# so a PR's workflow-file changes are inert as far as either job is
# concerned, no matter who opened it or what they changed. Don't relax
# this without re-reading GitHub's own self-hosted-runner security
# guidance for public repositories first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # Builds docker/Dockerfile's `build-base` stage once (every CPU-side
  # toolchain package this whole file needs: build-essential/cmake/ninja,
  # gtest/benchmark/spdlog/nlohmann-json/yaml-cpp, Arrow/Parquet/Flight/
  # Flight-SQL pinned to =25.0.1-1, gRPC, opentelemetry-cpp-dev,
  # clang-format-18/clang-tidy-18, gcovr -- see that stage's own comment)
  # and pushes it to the GHA cache under a single shared scope, so every
  # job below that also builds `target: build-base` gets a cache *hit*
  # instead of a race between several jobs' own cache-to writes for the
  # same scope landing in an unpredictable order. This job never `push:`s
  # or `load:`s the image itself -- populating the cache is the only
  # point of it, no test/lint work happens here.
  #
  # Replaces what used to be five separate, hand-maintained copies of the
  # same apt package list (one inside each of clang-tidy/cpu-build-test/
  # tpch-tooling-smoke/server-build-test/otel-build-test/coverage's own
  # steps) with docker/Dockerfile's build-base stage as the one source of
  # truth -- those five jobs now each `docker build --target build-base`
  # (fast, cache-from this job's own warm scope) then `docker run` their
  # own preset/test commands against it, instead of apt-installing
  # anything themselves.
  build-base-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and cache build-base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: build-base
          cache-from: type=gha,scope=build-base
          cache-to: type=gha,mode=max,scope=build-base

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          shopt -s globstar
          files=$(find src include tests -name '*.cpp' -o -name '*.hpp')
          clang-format-18 --style=file --dry-run --Werror $files

  # Covers every CPU-buildable src/*.cpp (the `cpu-dev` preset's own scope,
  # same as cpu-build-test below) against .clang-tidy's checks (bugprone-*,
  # performance-*, plus a handful of readability/cppcoreguidelines rules --
  # see .clang-tidy's own comments for what's deliberately excluded and
  # why). Needs a real build, not just `cmake --preset cpu-dev`: some included
  # headers only exist after FetchContent/build (e.g. hsql-src), and
  # HeaderFilterRegex still needs real Arrow/Parquet headers on disk to
  # resolve #includes correctly while parsing each translation unit.
  # server-build-test/otel-build-test below cover their own preset-specific
  # extra files (src/server/*.cpp, src/observability/query_tracing_otel.cpp)
  # in their own steps, since those need their own extra apt packages this
  # job doesn't install. GPU-only files (src/execution_gpu/*.cpp,
  # src/api/query_engine_execute_gpu.cpp, src/memory/rmm_environment.cpp,
  # src/server/gpu_execution_coordinator_gpu.cpp) are excluded for the same
  # reason the rest of this CI file never builds gpu-dev at all: no GPU/
  # libcudf/RMM on a standard GitHub-hosted runner (see this file's
  # top-of-file comment) -- verify those locally with a real gpu-dev build
  # before merging a change that touches them.
  clang-tidy:
    needs: build-base-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (build-base target, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: build-base
          load: true
          tags: kernellake-build-base:ci
          cache-from: type=gha,scope=build-base
      - name: Configure, build, and run clang-tidy
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-build-base:ci \
            bash -c "
              cmake --preset cpu-dev &&
              cmake --build --preset cpu-dev &&
              files=\$(find src -name '*.cpp' \
                ! -path 'src/execution_gpu/*' \
                ! -path 'src/memory/*' \
                ! -name 'query_engine_execute_gpu.cpp' \
                ! -path 'src/server/*' \
                ! -name 'query_tracing_otel.cpp' \
                ! -name 'query_tracing_test_support.cpp') &&
              run-clang-tidy-18 -p build/cpu-dev -quiet -j \"\$(nproc)\" -warnings-as-errors='*' \$files
            "

  cpu-build-test:
    # Config.hpp unconditionally pulls in Arrow's bundled google-cloud-cpp/
    # Azure SDK C++ code now (see docs/ARCHITECTURE.md's "Cloud object
    # storage" section), which needs the newer system Abseil build-base's
    # own ubuntu:26.04 base has -- see that stage's own comment.
    needs: build-base-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (build-base target, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: build-base
          load: true
          tags: kernellake-build-base:ci
          cache-from: type=gha,scope=build-base
      # --output-junit takes an absolute path deliberately: `ctest --preset`
      # runs with build/cpu-dev (the preset's own binaryDir) as its working
      # directory internally, so a bare relative filename here would land
      # inside build/cpu-dev/ instead of /workspace where the Codecov
      # upload step below expects to find it -- confirmed for real, a
      # relative path silently wrote the file one directory level off from
      # where it was expected.
      - name: Configure, build, and test
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-build-base:ci \
            bash -c "
              cmake --preset cpu-dev &&
              cmake --build --preset cpu-dev &&
              ctest --preset cpu-dev --output-on-failure --output-junit /workspace/test-results-cpu.xml
            "
      # if: !cancelled() (not the default `success()`) so this still runs
      # and uploads whichever tests DID execute even when ctest above
      # fails some of them -- test analytics is most useful exactly when
      # something failed. Only a genuine job cancellation skips it. If
      # cmake/cmake --build itself fails before ctest ever runs, the file
      # never gets created at all; fail_ci_if_error: false keeps that from
      # becoming a second, confusing failure on top of the real one.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results-cpu.xml
          report_type: test_results
          fail_ci_if_error: false

  coverage:
    # Rebuilds under a separate `cpu-coverage` preset (cpu-dev plus gcc's
    # --coverage instrumentation, see CMakePresets.json) rather than
    # reusing cpu-build-test's own build directory, since a coverage-
    # instrumented binary is slower and shouldn't be what every other job
    # is actually testing -- `needs: build-base-image` here is only for a
    # warm cache, not because this job depends on cpu-build-test passing.
    #
    # Builds+runs against docker/Dockerfile's own `build-base` stage
    # (docker/build-push-action, cache-from build-base-image's own warm
    # GHA cache) instead of apt-installing the same toolchain/Arrow
    # packages directly in this job's own steps -- avoids a second,
    # driftable copy of that package list (the one this job used to carry
    # directly matched docker/Dockerfile's own build-base stage by hand,
    # with no guarantee the two ever stayed in sync). gpu-coverage below
    # uses the identical pattern against gpu-build-base; ctest itself only
    # ever runs via `docker run` *after* the image is built, never inside
    # the Dockerfile -- `docker build` has no access to whatever device a
    # test suite needs (irrelevant for CPU tests, but the same reason
    # gpu-coverage's own GPU tests can't run at image-build time either).
    needs: build-base-image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (build-base target, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: build-base
          load: true
          tags: kernellake-build-base:ci
          cache-from: type=gha,scope=build-base
      - name: Configure, build, test, and generate coverage report
        # Restricted to src/ and include/ -- vendored third-party code
        # (build/cpu-coverage/_deps) and the tests themselves are never
        # part of the numerator or denominator; a test file covering
        # itself would be a meaningless metric. --exclude '_deps/' keeps
        # gcovr from even walking/gcov-parsing vendored hsql's own
        # coverage data (it's compiled with --coverage too, since the
        # cpu-coverage preset's flags apply project-wide) only to discard
        # it via --filter afterward -- --filter alone controls what's in
        # the *report*, not what gcovr spends time parsing to get there.
        #
        # --gcov-ignore-parse-errors=negative_hits.warn_once_per_file:
        # gcc's own gcov occasionally emits a negative branch-hit count on
        # some conditional branches (a real, long-standing gcov bug, not
        # anything in this codebase -- see
        # https://gcc.gnu.org/bugzilla/show_bug.cgi?id=68080, hit for real
        # on src/io/parquet_metadata.cpp's `if (stats->HasMinMax())`).
        # Newer gcovr treats this as a hard parse error by default; this
        # downgrades it to one warning per file instead of aborting the
        # whole report.
        #
        # -u/--user matches the container process's UID/GID to the
        # runner's own checkout owner, so every file docker run creates
        # (build/, coverage.xml) is owned by the same user afterward --
        # without it, root-owned build output would break later
        # non-Docker steps (the Codecov/artifact uploads) that read it
        # back outside the container.
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-build-base:ci \
            bash -c "
              cmake --preset cpu-coverage &&
              cmake --build --preset cpu-coverage &&
              ctest --preset cpu-coverage --output-on-failure &&
              gcovr --root . \
                --filter 'src/' --filter 'include/' \
                --exclude '.*_test\.cpp' \
                --exclude '.*/_deps/.*' \
                --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
                --xml-pretty -o coverage.xml \
                --print-summary \
                build/cpu-coverage
            "
      # Tokenless upload works for public GitHub repos on GitHub-hosted
      # runners (Codecov identifies the repo via the GitHub OIDC token) --
      # no CODECOV_TOKEN secret required, but one is picked up
      # automatically if a maintainer ever adds it. fail_ci_if_error:
      # false so a Codecov-side outage doesn't fail an otherwise-green PR;
      # the coverage.xml artifact upload below is the fallback if the
      # Codecov upload itself doesn't go through.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # Split out from gpu-coverage (not reusing it as docker-publish's own GPU
  # gate) for two real reasons: gpu-coverage only builds the
  # kernellake_gpu_tests *target* specifically, not the full gpu-dev build
  # (src/cli, src/server's GPU coordinator, benchmarks) that
  # docker-publish's own runtime-gpu image actually ships -- a broken
  # src/cli or GPU server-coordinator compile could pass gpu-coverage's own
  # gate undetected. And gpu-coverage's --coverage instrumentation makes
  # every build/run slower than a plain gpu-dev one needs to be, for a job
  # whose only job here is pass/fail, not a coverage number.
  gpu-build-test:
    # See this file's own top-of-file comment for the full self-hosted-
    # runner security rationale -- this `if:` is the actual enforcement of
    # it: only a direct push to main or a manual workflow_dispatch reaches
    # this job, never a pull_request (same-repo or fork). Same guard
    # gpu-coverage uses, and for the identical reason -- this job also runs
    # on the self-hosted runner, so it must never dispatch from an
    # untrusted PR either.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v7
      - name: Verify GPU is visible on the host
        run: nvidia-smi
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (gpu-build-base target)
        # Same image gpu-coverage uses -- Docker's own local layer cache on
        # this persistent runner means whichever of the two jobs runs
        # second gets an instant cache hit from the other, no duplicated
        # work either way.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: gpu-build-base
          load: true
          tags: kernellake-gpu-build-base:ci
      - name: Verify GPU passthrough into containers works
        run: docker run --rm --gpus all kernellake-gpu-build-base:ci nvidia-smi
      # --output-junit takes an absolute path deliberately -- same reason
      # as cpu-build-test's own identical comment: `ctest --preset` runs
      # with build/gpu-dev as its own working directory, so a relative
      # filename would land there instead of /workspace.
      - name: Configure, build, and test (gpu-dev preset, full build)
        # No --target restriction (unlike gpu-coverage) -- this builds
        # everything gpu-dev covers, src/cli and src/server's GPU
        # coordinator included, matching what docker-publish's own
        # runtime-gpu image actually ships. No coverage instrumentation
        # either, so no stale-build-directory concern the way
        # gpu-coverage's own .gcda files have -- a normal incremental
        # ninja build is safe to reuse across runs here.
        run: |
          docker run --rm --gpus all -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-gpu-build-base:ci \
            bash -c "
              cmake --preset gpu-dev -DCMAKE_CUDA_COMPILER=/usr/bin/nvcc &&
              cmake --build --preset gpu-dev &&
              ctest --preset gpu-dev --output-on-failure --output-junit /workspace/test-results-gpu.xml
            "
      # Same if: !cancelled() reasoning as cpu-build-test's own identical
      # step -- upload whichever tests ran even if some of them failed.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: test-results-gpu.xml
          report_type: test_results
          flags: gpu
          fail_ci_if_error: false

  gpu-coverage:
    # See this file's own top-of-file comment for the full self-hosted-
    # runner security rationale -- this `if:` is the actual enforcement of
    # it: only a direct push to main or a manual workflow_dispatch reaches
    # this job, never a pull_request (same-repo or fork).
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, gpu]
    # No `container:` job-level key here (unlike `coverage` using
    # docker/build-push-action's `load: true` + a plain `docker run`
    # instead) -- GitHub Actions' own `container:` key can't pass `--gpus
    # all` through to the container it starts, so GPU passthrough has to
    # go through an explicit `docker run` step instead. This also runs
    # ctest/gcovr *after* the image is built, never inside
    # docker/Dockerfile's own gpu-build-base target -- `docker build` has
    # no GPU access at all (only `docker run --gpus all` does), the same
    # reason gpu-release's own image build never runs ctest either (see
    # that stage's comment).
    steps:
      - uses: actions/checkout@v7
      - name: Verify GPU is visible on the host
        # Fails fast with a clear message rather than letting CMake's own
        # much-less-obvious CUDA-toolkit-detection error stand in for "the
        # runner's GPU disappeared/driver broke" if that ever happens.
        run: nvidia-smi
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (gpu-build-base target)
        # No GHA cache-from/cache-to here (unlike the `coverage` job) --
        # this runner is a persistent machine, not an ephemeral
        # GitHub-hosted one, so Docker's own local layer cache already
        # makes every run after the first one fast without needing the
        # extra network round trip pushing/pulling a remote cache would
        # cost. `load: true` still applies -- the built image needs to
        # land in this runner's local Docker daemon for the `docker run`
        # steps below to use it.
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: gpu-build-base
          load: true
          tags: kernellake-gpu-build-base:ci
      - name: Verify GPU passthrough into containers works
        # A separate, real concern from the host-level check above: the
        # NVIDIA Container Toolkit has to be installed and configured with
        # Docker specifically (`nvidia-ctk runtime configure`) for `--gpus
        # all` to work at all -- a runner can see its own GPU fine via a
        # bare `nvidia-smi` while this still fails if that toolkit was
        # never set up. Caught here, once, with an unambiguous error,
        # rather than as a confusing failure three steps later. Reuses the
        # image just built above (it already has nvidia-smi via
        # nvidia-cuda-toolkit) rather than pulling a separate external
        # image just for this check.
        run: docker run --rm --gpus all kernellake-gpu-build-base:ci nvidia-smi
      - name: Clean stale coverage build directory
        # This runner's filesystem persists between runs -- cpu-coverage's
        # own preset doc comment (gpu-coverage inherits the same gcov
        # instrumentation) warns .gcda files accumulate/overwrite with a
        # checksum mismatch across source changes if the build directory
        # isn't fresh; this is that same requirement, made explicit since
        # nothing else here provides it for free.
        run: rm -rf build/gpu-coverage
      - name: Configure, build, test, and generate coverage report
        # CMAKE_CUDA_COMPILER overridden explicitly: gpu-dev (which
        # gpu-coverage inherits) hardcodes /usr/local/cuda/bin/nvcc for
        # NVIDIA's own installer layout, but gpu-build-base installs CUDA
        # via apt's nvidia-cuda-toolkit instead (Debian packaging
        # convention: /usr/bin/nvcc) -- same override docker/Dockerfile's
        # own gpu-release stage already uses for the identical reason.
        #
        # Scoped to only the files that actually require
        # KERNELLAKE_WITH_CUDA=ON to compile/execute at all -- unlike the
        # `coverage` job's broad `src/`+`include/` filter, a matching
        # broad filter here would mostly re-report the exact same CPU-only
        # lines that job already covers (gpu-dev builds everything, GPU
        # and CPU code alike), just exercised by a different test binary.
        # Uploaded under its own `gpu` flag below so Codecov keeps it as a
        # distinct component instead of blending it with the `coverage`
        # job's own (different) numbers for any file that happens to
        # appear in both.
        #
        # -u/--user matches the container process's UID/GID to the
        # runner's own checkout owner, same reasoning as the `coverage`
        # job's identical flag.
        #
        # ctest --test-dir build/gpu-coverage/tests/gpu, not plain `ctest
        # --preset gpu-coverage`: the build step above only builds the
        # kernellake_gpu_tests *target* (deliberately -- see gpu-build-test's
        # own comment on why), but a preset-wide ctest run still tries to
        # execute every test CMake registered project-wide, including
        # tests/unit's own suite, which was never built. That reports as a
        # real CTest failure (`kernellake_unit_tests_NOT_BUILT`), confirmed
        # for real against a live run (this job failed with exactly that
        # error before this fix) and confirmed fixed the same way --
        # --test-dir scopes ctest to just that one CMake subdirectory's own
        # registered tests, which only depends on kernellake_gpu_tests
        # having been built.
        run: |
          docker run --rm --gpus all -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-gpu-build-base:ci \
            bash -c "
              cmake --preset gpu-coverage -DCMAKE_CUDA_COMPILER=/usr/bin/nvcc &&
              cmake --build --preset gpu-coverage --target kernellake_gpu_tests &&
              ctest --test-dir build/gpu-coverage/tests/gpu --output-on-failure &&
              gcovr --root . \
                --filter 'src/execution_gpu/' \
                --filter 'src/api/query_engine_execute_gpu' \
                --filter 'src/memory/gpu_memory_metrics' \
                --filter 'src/memory/rmm_environment' \
                --filter 'src/server/gpu_execution_coordinator_gpu' \
                --exclude '.*_test\.cpp' \
                --exclude '.*/_deps/.*' \
                --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
                --xml-pretty -o gpu-coverage.xml \
                --print-summary \
                build/gpu-coverage
            "
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: gpu-coverage.xml
          flags: gpu
          fail_ci_if_error: false
      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpu-coverage-report
          path: gpu-coverage.xml
          retention-days: 30

  tpch-tooling-smoke:
    needs: [build-base-image, cpu-build-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (build-base target, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: build-base
          load: true
          tags: kernellake-build-base:ci
          cache-from: type=gha,scope=build-base
      # No -u UID:GID on any docker run below (unlike cpu-build-test/
      # clang-tidy/coverage) -- this job's own pip install needs a writable
      # home directory, and nothing downstream of these steps reads
      # build/ back out on the host, so running as root here (matching
      # this job's own pre-Docker container: ubuntu:26.04 behavior, which
      # also ran as root) is simplest.
      - name: Build (cpu-dev preset)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace kernellake-build-base:ci \
            bash -c "cmake --preset cpu-dev && cmake --build --preset cpu-dev"
      - name: generate-data smoke test
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace kernellake-build-base:ci \
            ./build/cpu-dev/src/cli/kernellake generate-data --output /workspace/tmp/kernellake-sales --rows 10000 --files 2

      # SF1 is the spec's own CI recommendation, but that is a ~6,000,000-row
      # generation run (see tools/generate_tpch.py); a much smaller scale
      # factor is used here to keep CI fast and storage-light, per the same
      # spec section's own allowance ("SF1000 where sufficient storage is
      # available" implies scale is adjusted to the environment). Run the
      # real SF1 generation manually or on a runner sized for it.
      #
      # Output goes under /workspace/tmp, not plain /tmp: each `docker run`
      # below is its own ephemeral container, and only the bind-mounted
      # /workspace persists across separate docker run invocations, not the
      # rest of that container's filesystem -- a real failure this exact
      # job hit for real, generating into plain /tmp here and then the
      # query-file validation step below finding nothing there. Same
      # reasoning already applied to pyarrow itself: installed here, in the
      # same docker run as the script that needs it, not a separate step.
      - name: TPC-H data-generation smoke test (small scale factor)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace kernellake-build-base:ci \
            bash -c "
              pip install --break-system-packages pyarrow &&
              python3 tools/generate_tpch.py --scale-factor 0.001 --output /workspace/tmp/kernellake-tpch-smoke \
                --row-group-rows 2000 --files 1
            "

      # No GPU here, so `kernellake query` can't run -- `explain` still
      # exercises SQL parsing, binding, logical planning, optimization, and
      # physical planning (including pruning) against the real generated
      # Parquet files, which is enough to catch a query file that no longer
      # parses/binds against the schema generate_tpch.py produces.
      - name: TPC-H query-file validation (parse/bind/plan only, no GPU)
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace kernellake-build-base:ci \
            bash -c '
              # {data} must resolve to lineitem-*.parquet specifically, not a
              # bare *.parquet glob -- generate_tpch.py now writes lineitem/
              # part/orders/customer/supplier/nation/region/partsupp all into
              # this same directory, so an unqualified glob would pull in
              # every table at once and fail with a schema mismatch. Every
              # other placeholder any query file references is substituted
              # unconditionally too, one sed expression per placeholder (with
              # /g, since some queries -- e.g. Q7'"'"'s/Q11'"'"'s own {nation_data} --
              # reference the same placeholder more than once); a query file
              # that does not contain a given placeholder is unaffected by that
              # expression.
              for q in benchmarks/tpch/queries/*.sql; do
                sql=$(grep -v "^--" "$q" | tr "\n" " " | \
                  sed "s|{data}|/workspace/tmp/kernellake-tpch-smoke/lineitem-*.parquet|g; \
                       s|{part_data}|/workspace/tmp/kernellake-tpch-smoke/part-*.parquet|g; \
                       s|{orders_data}|/workspace/tmp/kernellake-tpch-smoke/orders-*.parquet|g; \
                       s|{customer_data}|/workspace/tmp/kernellake-tpch-smoke/customer-*.parquet|g; \
                       s|{supplier_data}|/workspace/tmp/kernellake-tpch-smoke/supplier-*.parquet|g; \
                       s|{nation_data}|/workspace/tmp/kernellake-tpch-smoke/nation-*.parquet|g; \
                       s|{region_data}|/workspace/tmp/kernellake-tpch-smoke/region-*.parquet|g; \
                       s|{partsupp_data}|/workspace/tmp/kernellake-tpch-smoke/partsupp-*.parquet|g")
                echo "=== $q ==="
                ./build/cpu-dev/src/cli/kernellake explain --sql "$sql"
              done
            '

  server-build-test:
    # kernellake-server (KERNELLAKE_BUILD_SERVER=ON) needs
    # libarrow-flight-sql-dev, which does not link against Ubuntu 24.04's
    # system Abseil -- see docs/ARCHITECTURE.md's "Ubuntu 26.04 baseline"
    # section, and docker/Dockerfile's build-base stage's own comment for
    # why that stage (ubuntu:26.04-based) already carries every package
    # this job needs, Flight SQL and gRPC included -- nothing extra to
    # install here.
    needs: [build-base-image, cpu-build-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (build-base target, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: build-base
          load: true
          tags: kernellake-build-base:ci
          cache-from: type=gha,scope=build-base
      - name: Configure, build, and test
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-build-base:ci \
            bash -c "
              cmake --preset server-dev &&
              cmake --build --preset server-dev &&
              ctest --preset server-dev --output-on-failure
            "
      # The clang-tidy job above covers every file the `cpu-dev` preset builds;
      # src/server/*.cpp only exists in this preset (KERNELLAKE_BUILD_SERVER),
      # so it's checked here instead, against this job's own already-built
      # server-dev compile_commands.json.
      - name: Run clang-tidy (src/server -- server-dev-only files)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-build-base:ci \
            bash -c "run-clang-tidy-18 -p build/server-dev -quiet -j \"\$(nproc)\" -warnings-as-errors='*' src/server/*.cpp"

  otel-build-test:
    # kernellake's OpenTelemetry integration (KERNELLAKE_ENABLE_OTEL=ON)
    # needs opentelemetry-cpp-dev, which -- like libarrow-flight-sql-dev --
    # has no Ubuntu 24.04 apt package at all (FetchContent vendoring would
    # be the only option there; see docs/ARCHITECTURE.md's "Ubuntu 26.04
    # baseline" section). docker/Dockerfile's build-base stage (ubuntu:
    # 26.04-based) already carries opentelemetry-cpp-dev and gRPC, same
    # reasoning as server-build-test's own comment -- nothing extra to
    # install here either.
    needs: [build-base-image, cpu-build-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build coverage image (build-base target, cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: build-base
          load: true
          tags: kernellake-build-base:ci
          cache-from: type=gha,scope=build-base
      - name: Configure, build, and test
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-build-base:ci \
            bash -c "
              cmake --preset otel-dev &&
              cmake --build --preset otel-dev &&
              ctest --preset otel-dev --output-on-failure
            "
      # See server-build-test's own equivalent step: src/observability's
      # OTEL-specific files only exist in this preset
      # (KERNELLAKE_ENABLE_OTEL), so they're checked here against this job's
      # own already-built otel-dev compile_commands.json.
      - name: Run clang-tidy (src/observability -- otel-dev-only files)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
            kernellake-build-base:ci \
            bash -c "
              run-clang-tidy-18 -p build/otel-dev -quiet -j \"\$(nproc)\" -warnings-as-errors='*' \
                src/observability/query_tracing_otel.cpp src/observability/query_tracing_test_support.cpp
            "

  docker-publish:
    runs-on: ubuntu-24.04
    # gpu-build-test included so a broken GPU build/test never ships in
    # runtime-gpu either, the same protection cpu-build-test already gives
    # runtime-cpu -- previously nothing gated runtime-gpu's publish on a
    # real GPU test run at all (gpu-release's own Dockerfile stage can't
    # run ctest at `docker build` time, no GPU device then). Trade-off
    # accepted knowingly: this couples docker-publish (both images, one
    # job) to the self-hosted runner's own availability -- if that machine
    # is offline, gpu-build-test never completes and this job waits on it
    # indefinitely rather than skipping, unlike a pull_request run (where
    # gpu-build-test's own `if:` skips it cleanly and this job's identical
    # `if:` skips right along with it).
    needs: [format-check, cpu-build-test, tpch-tooling-smoke, gpu-build-test]
    # Only publish on an actual push to main -- never on pull_request (a
    # fork's PR run has no packages:write on GITHUB_TOKEN anyway, and an
    # untrusted PR build shouldn't produce a published image) or when one
    # of the jobs above didn't run (e.g. workflow_dispatch is fine since
    # needs: still applies; this `if:` only excludes pull_request).
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Free up runner disk space
        run: |
          # CUDA devel images plus vendored RAPIDS wheels are large;
          # reclaim space from pre-installed toolchains this build never
          # touches (a common workaround for GitHub-hosted runners' fixed
          # disk size).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      # Two separate repositories, not one repository with :cpu/:gpu tags --
      # kernel-lake-cpu and kernel-lake-gpu (each :latest). Only the two
      # runtime-{cpu,gpu} targets are published; the build-base/cpu-release/
      # gpu-build-base/gpu-release stages (full toolchain, source tree) are
      # intermediate-only (see docker/Dockerfile's own top-of-file comment)
      # -- nothing publishes a :dev image any more.
      - name: Compute lowercase repository base name
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only -- arm64 was previously also built here (verified
      # working via QEMU user-mode emulation, since no arm64 runner is
      # available), but deliberately turned back off; re-enable by adding
      # `linux/arm64` back to `platforms:` and restoring a
      # `docker/setup-qemu-action@v3` step before this one if needed again.
      - name: Build and push CPU runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-cpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.base }}-cpu:latest
          cache-from: type=gha,scope=runtime-cpu
          cache-to: type=gha,mode=max,scope=runtime-cpu

      # linux/amd64 only here too: nvidia-cuda-toolkit/libcufile-dev's own
      # arm64 apt availability and RAPIDS libcudf/RMM's arm64 wheel support
      # (cmake/ThirdPartyRapids.cmake's pinned `-cu12` PyPI wheels) have
      # never been verified for real -- unlike runtime-cpu above, getting
      # this wrong can't be caught by a build-only smoke test (CUDA/RAPIDS
      # code only actually exercises real GPU execution paths at `docker
      # run --gpus all` time, which needs real arm64 GPU hardware, e.g.
      # NVIDIA Grace/Jetson, to verify at all -- see docs/ROADMAP.md).
      - name: Build and push GPU runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.base }}-gpu:latest
          cache-from: type=gha,scope=runtime-gpu
          cache-to: type=gha,mode=max,scope=runtime-gpu

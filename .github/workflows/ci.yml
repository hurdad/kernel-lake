# KernelLake CI. One workflow, seven jobs, in dependency order:
#
#   format-check ------------------+
#                                   +--> docker-publish (push to main only)
#   cpu-build-test --+--> tpch-tooling-smoke --+
#                     +--> server-build-test
#                     +--> otel-build-test
#
#   clang-tidy (standalone lint job -- no `needs:` of its own, and not in
#               docker-publish's `needs:` list either; see below)
#
# docker-publish only starts once format-check, cpu-build-test, AND
# tpch-tooling-smoke have all succeeded (via `needs:`) -- a broken build or
# a query file that stops parsing is never shipped as an image. clang-tidy
# (like format-check) is a standalone lint job with no `needs:` of its own
# and isn't in docker-publish's `needs:` list either -- a clang-tidy
# regression should be visibly red on the PR/commit, same as any other job,
# but a lint-only finding blocking the docker image specifically wasn't
# judged worth coupling here (unlike format-check, which already gated
# docker-publish before this job existed, so it stayed as-is rather than
# being second-guessed). server-build-test/otel-build-test are independent
# of docker-publish's gating: they exist to catch
# KERNELLAKE_BUILD_SERVER/KERNELLAKE_ENABLE_OTEL regressions specifically
# (docker/Dockerfile's own `cmake --preset gpu-dev` invocation turns both on
# unconditionally, so a failure there would also break docker-publish, but
# these two jobs run the CPU-only server-dev/otel-dev presets instead of
# gpu-dev, so their pass/fail is deliberately independent of what
# docker-publish actually ships). Cross-workflow `needs:` isn't a feature
# GitHub Actions has, which is why this is one file instead of a separate
# docker-publish.yml gated some other way (e.g. `workflow_run`, which has
# its own checkout/SHA gotchas).
#
# Every job's underlying shell commands (apt installs, CMake presets,
# ctest, docker buildx) mirror commands actually run and verified in this
# repository's own development environment. All five build-and-test jobs
# (clang-tidy, cpu-build-test, tpch-tooling-smoke, server-build-test,
# otel-build-test) run inside a plain `ubuntu:26.04` container (the
# `container:` key, on the same `ubuntu-24.04` GitHub-hosted runner --
# there is no `ubuntu-26.04` runner label yet) rather than on the runner's
# own Ubuntu 24.04 directly:
# libarrow-flight-sql-dev and opentelemetry-cpp-dev have always needed
# 26.04 (see docs/ARCHITECTURE.md's "Ubuntu 26.04 baseline" section for
# why -- Ubuntu 24.04's system Abseil is too old, so Arrow bundles its own
# incomplete private copy there instead), and cloud object storage support
# (see "Cloud object storage" in the same doc) means every build now
# unconditionally links Arrow's bundled google-cloud-cpp/Azure SDK C++
# code too, not just the server/otel-enabled presets -- so this same
# constraint now applies to cpu-build-test/tpch-tooling-smoke as well,
# not just server-build-test/otel-build-test. The GitHub Actions runs
# themselves have not been executed (no way to trigger an actual Actions
# run from within this repository's development environment); review the
# first run before trusting it blindly.
#
# GPU-dependent work (the `gpu-dev` preset, `tests/gpu/`, real query
# execution, DuckDB cross-validation, and TPC-H benchmarks) is
# intentionally NOT run here: standard GitHub-hosted runners have no GPU,
# and per the spec's own rule, KernelLake never reports a skipped-GPU test
# as passing. That work needs a self-hosted GPU runner, which is not
# configured in this repository -- see docs/ROADMAP.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          shopt -s globstar
          files=$(find src include tests -name '*.cpp' -o -name '*.hpp')
          clang-format-18 --style=file --dry-run --Werror $files

  # Covers every CPU-buildable src/*.cpp (the `dev` preset's own scope, same
  # as cpu-build-test below) against .clang-tidy's checks (bugprone-*,
  # performance-*, plus a handful of readability/cppcoreguidelines rules --
  # see .clang-tidy's own comments for what's deliberately excluded and
  # why). Needs a real build, not just `cmake --preset dev`: some included
  # headers only exist after FetchContent/build (e.g. hsql-src), and
  # HeaderFilterRegex still needs real Arrow/Parquet headers on disk to
  # resolve #includes correctly while parsing each translation unit.
  # server-build-test/otel-build-test below cover their own preset-specific
  # extra files (src/server/*.cpp, src/observability/query_tracing_otel.cpp)
  # in their own steps, since those need their own extra apt packages this
  # job doesn't install. GPU-only files (src/execution_gpu/*.cpp,
  # src/api/query_engine_execute_gpu.cpp, src/memory/rmm_environment.cpp,
  # src/server/gpu_execution_coordinator_gpu.cpp) are excluded for the same
  # reason the rest of this CI file never builds gpu-dev at all: no GPU/
  # libcudf/RMM on a standard GitHub-hosted runner (see this file's
  # top-of-file comment) -- verify those locally with a real gpu-dev build
  # before merging a change that touches them.
  clang-tidy:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev clang-tidy-18 \
            libavro-dev libcurl4-openssl-dev \
            libgrpc++-dev protobuf-compiler-grpc
      - name: Install Apache Arrow / Parquet C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends libarrow-dev libparquet-dev libarrow-dataset-dev
      - name: Configure and build (dev preset, CPU-only)
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: Run clang-tidy
        run: |
          files=$(find src -name '*.cpp' \
            ! -path 'src/execution_gpu/*' \
            ! -path 'src/memory/*' \
            ! -name 'query_engine_execute_gpu.cpp' \
            ! -path 'src/server/*' \
            ! -name 'query_tracing_otel.cpp' \
            ! -name 'query_tracing_test_support.cpp')
          run-clang-tidy-18 -p build/dev -quiet -j "$(nproc)" -warnings-as-errors='*' $files

  cpu-build-test:
    # See this file's own top-of-file comment: plain ubuntu:26.04 (via
    # `container:`, same runner as every other job), not the runner's own
    # Ubuntu 24.04 directly -- config.hpp unconditionally pulls in Arrow's
    # bundled google-cloud-cpp/Azure SDK C++ code now (see
    # docs/ARCHITECTURE.md's "Cloud object storage" section), which needs
    # the same newer system Abseil 26.04 has and 24.04 doesn't.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev \
            libavro-dev libcurl4-openssl-dev \
            libgrpc++-dev protobuf-compiler-grpc
      - name: Install Apache Arrow / Parquet C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends libarrow-dev libparquet-dev libarrow-dataset-dev
      - name: Configure (dev preset, CPU-only)
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure

  tpch-tooling-smoke:
    # See cpu-build-test's own comment on why this needs ubuntu:26.04 too.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: cpu-build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev \
            libavro-dev libcurl4-openssl-dev \
            libgrpc++-dev protobuf-compiler-grpc
      - name: Install Apache Arrow / Parquet C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends libarrow-dev libparquet-dev libarrow-dataset-dev
      - name: Install pyarrow (for generate_tpch.py)
        run: pip install --user --break-system-packages pyarrow
      - name: Build (dev preset)
        run: |
          cmake --preset dev
          cmake --build --preset dev
      - name: generate-data smoke test
        run: |
          ./build/dev/src/cli/kernellake generate-data --output /tmp/kernellake-sales --rows 10000 --files 2

      # SF1 is the spec's own CI recommendation, but that is a ~6,000,000-row
      # generation run (see tools/generate_tpch.py); a much smaller scale
      # factor is used here to keep CI fast and storage-light, per the same
      # spec section's own allowance ("SF1000 where sufficient storage is
      # available" implies scale is adjusted to the environment). Run the
      # real SF1 generation manually or on a runner sized for it.
      - name: TPC-H data-generation smoke test (small scale factor)
        run: |
          python3 tools/generate_tpch.py --scale-factor 0.001 --output /tmp/kernellake-tpch-smoke \
            --row-group-rows 2000 --files 1

      # No GPU here, so `kernellake query` can't run -- `explain` still
      # exercises SQL parsing, binding, logical planning, optimization, and
      # physical planning (including pruning) against the real generated
      # Parquet files, which is enough to catch a query file that no longer
      # parses/binds against the schema generate_tpch.py produces.
      - name: TPC-H query-file validation (parse/bind/plan only, no GPU)
        run: |
          # {data} must resolve to lineitem-*.parquet specifically, not a
          # bare *.parquet glob -- generate_tpch.py now writes lineitem/
          # part/orders/customer all into this same directory, so an
          # unqualified glob would pull in every table at once and fail
          # with a schema mismatch. {part_data}/{orders_data}/
          # {customer_data} are substituted unconditionally too, one sed
          # expression per placeholder; a query file that doesn't contain
          # a given placeholder is unaffected by that expression.
          for q in benchmarks/tpch/queries/*.sql; do
            sql=$(grep -v '^--' "$q" | tr '\n' ' ' | \
              sed "s|{data}|/tmp/kernellake-tpch-smoke/lineitem-*.parquet|; \
                   s|{part_data}|/tmp/kernellake-tpch-smoke/part-*.parquet|; \
                   s|{orders_data}|/tmp/kernellake-tpch-smoke/orders-*.parquet|; \
                   s|{customer_data}|/tmp/kernellake-tpch-smoke/customer-*.parquet|")
            echo "=== $q ==="
            ./build/dev/src/cli/kernellake explain --sql "$sql"
          done

  server-build-test:
    # kernellake-server (KERNELLAKE_BUILD_SERVER=ON) needs
    # libarrow-flight-sql-dev, which does not link against Ubuntu 24.04's
    # system Abseil -- see docs/ARCHITECTURE.md's "Ubuntu 26.04 baseline"
    # section. Standard GitHub-hosted runners don't offer an ubuntu-26.04
    # label yet, so this job stays on the same ubuntu-24.04 runner as every
    # other job but runs its steps inside a plain `ubuntu:26.04` container
    # instead (the `container:` key), the same base image
    # `docker/Dockerfile` itself builds on.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: cpu-build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev clang-tidy-18 \
            libavro-dev libcurl4-openssl-dev
      - name: Install Apache Arrow / Parquet / Flight SQL C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends \
            libarrow-dev libparquet-dev libarrow-dataset-dev \
            libarrow-flight-dev libarrow-flight-sql-dev
      - name: Install gRPC
        run: apt-get install -y --no-install-recommends libgrpc++-dev protobuf-compiler-grpc
      - name: Configure (server-dev preset)
        run: cmake --preset server-dev
      - name: Build
        run: cmake --build --preset server-dev
      - name: Test
        run: ctest --preset server-dev --output-on-failure
      # The clang-tidy job above covers every file the `dev` preset builds;
      # src/server/*.cpp only exists in this preset (KERNELLAKE_BUILD_SERVER),
      # so it's checked here instead, against this job's own already-built
      # server-dev compile_commands.json.
      - name: Run clang-tidy (src/server -- server-dev-only files)
        run: run-clang-tidy-18 -p build/server-dev -quiet -j "$(nproc)" -warnings-as-errors='*' src/server/*.cpp

  otel-build-test:
    # kernellake's OpenTelemetry integration (KERNELLAKE_ENABLE_OTEL=ON)
    # needs opentelemetry-cpp-dev, which -- like libarrow-flight-sql-dev --
    # has no Ubuntu 24.04 apt package at all (FetchContent vendoring would
    # be the only option there; see docs/ARCHITECTURE.md's "Ubuntu 26.04
    # baseline" section). Same container: ubuntu:26.04 approach as
    # server-build-test, for the same reason (no ubuntu-26.04 GitHub-hosted
    # runner label yet).
    #
    # Also needs gRPC explicitly: opentelemetry-cpp-dev's own apt Depends
    # is just `opentelemetry-cpp (= ...)` -- no gRPC dependency declared at
    # the package-manager level at all (confirmed via `apt-cache depends
    # opentelemetry-cpp-dev`) -- but its exporters_otlp_grpc CMake
    # component needs gRPC's own CMake config package (from libgrpc++-dev)
    # to resolve find_package(opentelemetry-cpp ... COMPONENTS
    # exporters_otlp_grpc ...) at all. The root CMakeLists.txt's own
    # find_package(gRPC REQUIRED) is scoped to KERNELLAKE_BUILD_SERVER
    # only, not KERNELLAKE_ENABLE_OTEL, so this job needs its own explicit
    # install, same package as server-build-test's "Install gRPC" step.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    needs: cpu-build-test
    steps:
      - uses: actions/checkout@v4
      - name: Install core toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config wget ca-certificates lsb-release gnupg \
            python3 python3-pip \
            libgtest-dev libbenchmark-dev libspdlog-dev nlohmann-json3-dev libyaml-cpp-dev \
            libxml2-dev uuid-dev clang-tidy-18 \
            libavro-dev libcurl4-openssl-dev
      - name: Install Apache Arrow / Parquet C++
        run: |
          wget -O /tmp/arrow-apt-source.deb \
            "https://packages.apache.org/artifactory/arrow/ubuntu/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          apt-get install -y -V /tmp/arrow-apt-source.deb
          apt-get update
          apt-get install -y --no-install-recommends libarrow-dev libparquet-dev libarrow-dataset-dev
      - name: Install opentelemetry-cpp
        run: apt-get install -y --no-install-recommends opentelemetry-cpp-dev
      - name: Install gRPC
        run: apt-get install -y --no-install-recommends libgrpc++-dev protobuf-compiler-grpc
      - name: Configure (otel-dev preset)
        run: cmake --preset otel-dev
      - name: Build
        run: cmake --build --preset otel-dev
      - name: Test
        run: ctest --preset otel-dev --output-on-failure
      # See server-build-test's own equivalent step: src/observability's
      # OTEL-specific files only exist in this preset
      # (KERNELLAKE_ENABLE_OTEL), so they're checked here against this job's
      # own already-built otel-dev compile_commands.json.
      - name: Run clang-tidy (src/observability -- otel-dev-only files)
        run: |
          run-clang-tidy-18 -p build/otel-dev -quiet -j "$(nproc)" -warnings-as-errors='*' \
            src/observability/query_tracing_otel.cpp src/observability/query_tracing_test_support.cpp

  docker-publish:
    runs-on: ubuntu-24.04
    needs: [format-check, cpu-build-test, tpch-tooling-smoke]
    # Only publish on an actual push to main -- never on pull_request (a
    # fork's PR run has no packages:write on GITHUB_TOKEN anyway, and an
    # untrusted PR build shouldn't produce a published image) or when one
    # of the jobs above didn't run (e.g. workflow_dispatch is fine since
    # needs: still applies; this `if:` only excludes pull_request).
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          # CUDA devel images plus vendored RAPIDS wheels are large;
          # reclaim space from pre-installed toolchains this build never
          # touches (a common workaround for GitHub-hosted runners' fixed
          # disk size).
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      # Two separate repositories, not one repository with :cpu/:gpu tags --
      # kernel-lake-cpu and kernel-lake-gpu (each :latest). Only the two
      # runtime-{cpu,gpu} targets are published; the dev-{cpu,gpu} build
      # stages (full toolchain, source tree) are intermediate-only now (see
      # docker/Dockerfile's own top-of-file comment) -- nothing publishes a
      # :dev image any more.
      - name: Compute lowercase repository base name
        id: image
        run: echo "base=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64,linux/arm64: every dependency runtime-cpu needs is a
      # plain apt package with a real arm64 build on Ubuntu 26.04 (verified
      # by a real docker buildx build --platform linux/arm64 -- runs under
      # QEMU user-mode emulation on this project's own amd64 development
      # machine, since no arm64 runner is available either here or on
      # GitHub-hosted infrastructure yet). docker/build-push-action pushes
      # one multi-arch manifest list per tag, not a separate arch-suffixed
      # tag -- `docker pull ghcr.io/.../kernel-lake-cpu:latest` resolves to
      # the right architecture automatically on either host.
      - name: Build and push CPU runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.base }}-cpu:latest
          cache-from: type=gha,scope=runtime-cpu
          cache-to: type=gha,mode=max,scope=runtime-cpu

      # linux/amd64 only, for now: nvidia-cuda-toolkit/libcufile-dev's own
      # arm64 apt availability and RAPIDS libcudf/RMM's arm64 wheel support
      # (cmake/ThirdPartyRapids.cmake's pinned `-cu12` PyPI wheels) haven't
      # been verified for real yet -- unlike runtime-cpu above, getting this
      # wrong can't be caught by a build-only smoke test (CUDA/RAPIDS code
      # only actually exercises real GPU execution paths at `docker run
      # --gpus all` time, which needs real arm64 GPU hardware, e.g. NVIDIA
      # Grace/Jetson, to verify at all -- see docs/ROADMAP.md). Extending
      # this to linux/amd64,linux/arm64 is a tracked follow-up once that
      # verification happens, not an oversight.
      - name: Build and push GPU runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime-gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.base }}-gpu:latest
          cache-from: type=gha,scope=runtime-gpu
          cache-to: type=gha,mode=max,scope=runtime-gpu
